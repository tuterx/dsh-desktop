name: auto-build-dmg

# Builds a fresh DMG whenever upstream deepseek-harness changes, and publishes
# it to the GitHub Release of this repo.
#
# Triggers:
#   - schedule:  every 6 hours, checks upstream HEAD; skips when unchanged
#   - workflow_dispatch: manual "Run workflow" button on GitHub
#   - push:      rebuild when this repo's build tooling changes

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Never build twice in parallel: a scheduled run racing a push run for the
# same upstream commit produces the same tag, and the loser fails at publish
# (or wastes a 6-minute build). The queued run then sees the tag at its
# check step and skips. cancel-in-progress: false keeps the older run.
concurrency:
  group: auto-build-dmg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Setup Node 24 + pnpm
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: corepack enable && pnpm --version

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pnpm
            ~/Library/Caches/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-pnpm-${{ hashFiles('resources/dsh/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Prepare resources (pull upstream, build dsh, fetch Node)
        run: bash scripts/prepare.sh --force
        env:
          NODE_MIRROR: https://npmmirror.com/mirrors/node
          ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
          APP_SHA: ${{ github.sha }}

      # prepare.sh prunes dev-only tooling from node_modules (~300MB); boot
      # the trimmed runtime exactly like the app launcher does, so a future
      # upstream change that starts requiring a pruned package fails CI
      # instead of shipping a broken app.
      - name: Smoke test trimmed runtime
        run: |
          (cd resources/dsh && ../node/bin/node apps/cli/lib/bin.js web --host 127.0.0.1 --port 9988 > /tmp/dsh-smoke.log 2>&1 & echo $! > /tmp/dsh-smoke.pid)
          OK=0
          for i in $(seq 1 90); do
            if curl -sf --noproxy "*" -o /dev/null http://127.0.0.1:9988/; then OK=1; break; fi
            sleep 1
          done
          kill $(cat /tmp/dsh-smoke.pid) 2>/dev/null || true
          if [ "$OK" != "1" ]; then echo "SMOKE FAILED:"; tail -20 /tmp/dsh-smoke.log; exit 1; fi
          curl -s --noproxy "*" http://127.0.0.1:9988/ | grep -q "__DSH_BOOT__" && echo "SMOKE OK: page serves"

      - name: Read build metadata
        id: upstream
        run: |
          echo "commit=$(cat resources/UPSTREAM_COMMIT)" >> "$GITHUB_OUTPUT"
          echo "app=$(cat resources/APP_BUILD)" >> "$GITHUB_OUTPUT"

      # Release identity = "dsh-<upstream12><app7>": the in-app updater treats
      # a change in EITHER part as a new build, so shell-code fixes ship too.
      - name: Check existing release for this build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT="${{ steps.upstream.outputs.commit }}"
          APP="${{ steps.upstream.outputs.app }}"
          TAG="dsh-${COMMIT:0:12}${APP}"
          # The tag must ALWAYS be emitted: the queued duplicate run of the
          # same push finds the release already exists, and without the tag
          # the publish step would upload to an empty name and fail.
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Build unconditionally: with two platform workflows publishing the
      # same tag concurrently, a 'skip if release exists' gate lets the other
      # platform win the race and this one never uploads its assets (the
      # 66fe6b9 release ended up with only Windows files). Build + publish
      # always; the publish step uploads into an existing release when needed.
      - name: Build DMG + ZIP
        # --publish never: electron-builder in CI tries to auto-publish and
        # fails without GH_TOKEN; publishing is done by the release step below.
        # The ZIP is the seamless in-app update payload; the DMG stays as the
        # manual-install fallback.
        run: npm install && npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT="${{ steps.upstream.outputs.commit }}"
          TAG="${{ steps.check.outputs.tag }}"
          SHORT="${COMMIT:0:12}"
          DMG=$(ls -t release/*.dmg | head -1)
          ZIP=$(ls -t release/*-mac.zip | head -1)
          # The other platform workflow may have published this same tag
          # first (concurrent builds) - add our assets instead of skipping,
          # so every release carries both platforms' files.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists - uploading missing assets"
            gh release upload "$TAG" "$DMG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$DMG" "$ZIP" \
            --title "DeepSeek Harness desktop @ upstream ${SHORT}" \
            --notes "Auto-built from deepseek-harness @ ${COMMIT}" \
            --latest
          fi
